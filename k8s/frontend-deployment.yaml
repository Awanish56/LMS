
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-frontend
  namespace: doctor-appointment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lms-frontend
  template:
    metadata:
      labels:
        app: lms-frontend
    spec:
      containers:
        - name: frontend
          image: awanish56/lms-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
