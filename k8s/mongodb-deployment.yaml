
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: doctor-appointment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lms-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lms-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongo-pvc

